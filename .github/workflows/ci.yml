name: Publish SMT Z3 VS Code Extension
on:
  workflow_dispatch:
  push:
    tags:
      - "*"
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npx @vscode/vsce@latest publish --oidc
      - run: npx ovsx publish --trusted-publishing
